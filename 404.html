<!DOCTYPE html>
<html lang="en" data-page-title="meta.title.404">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Serenio</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#faf7f2" />
    <link rel="icon" href="/images/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/glitten.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/serenio.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <script src="/js/boot.js"></script>
  </head>
  <body>
    <main id="main" class="page-head" style="min-height:100dvh;display:grid;place-items:center;text-align:center">
      <div class="mesh" aria-hidden="true">
        <div class="mesh__blob mesh__blob--1"></div>
        <div class="mesh__blob mesh__blob--2"></div>
        <div class="mesh__blob mesh__blob--3"></div>
        <div class="mesh__well"></div>
      </div>
      <div class="shell page-head__inner" style="display:grid;justify-items:center">
        <div class="orb" style="--orb-size:96px" aria-hidden="true">
          <div class="orb__glow"></div>
          <div class="orb__body"><div class="orb__swirl"></div><div class="orb__spec"></div></div>
        </div>
        <h1 style="margin-top:2rem;max-width:none" data-i18n="nf.title">This page wandered off.</h1>
        <p style="margin-inline:auto" data-i18n="nf.body">The link may be old, or the page may have moved. Let's get you somewhere quieter.</p>
        <div class="cta-row" style="justify-content:center;margin-top:2rem">
          <a class="btn btn--primary" href="/" data-i18n="nf.home">Back to Serenio</a>
          <a class="btn btn--ghost" href="/how-it-works" data-i18n="nav.how">How it works</a>
        </div>
        <p class="cta-note" data-i18n-html="nf.care">Need support right now? <a href="https://webapp.serenio.ai/care" style="color:var(--plum);font-weight:600;text-decoration:underline">Find a support line</a>.</p>
      </div>
    </main>
    <script src="/js/i18n/core.js"></script>
    <script src="/js/i18n/misc.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
